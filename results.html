<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results - Monday Nite League</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1>🎯 Monday Nite League</h1>
  <p>Darts & Dominoes League 🎲</p>
</header>

<nav>
  <a href="index.html">🏆 League</a>
  <a href="fixtures.html">📅 Fixtures</a>
  <a href="results.html">📄 Results</a>
  <a href="stats.html">🎯 Player Stats</a>
  <a href="halloffame.html">🏅 Hall of Fame</a>
  <a href="admin.html">🔐 Admin</a>
</nav>

<div class="card">

  <h2>📄 Results</h2>

  <label for="resultWeek">Choose Week</label>

  <select id="resultWeek">
    <option value="all">All Weeks</option>
  </select>

  <br><br>
<div id="results"></div>

  <table>

    <thead>
      <tr>
        <th>Week</th>
        <th>Home</th>
        <th>Score</th>
        <th>Away</th>
      </tr>
    </thead>

    <tbody id="resultsTable">

      <tr>
        <td colspan="4">
          Loading results...
        </td>
      </tr>

    </tbody>

  </table>

</div>

<script>

const SUPABASE_URL =
  "https://wevedaffdzdvbkxydblw.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_NJ5-zUej-yNedbcp4dMPrQ_IYRH4p6t" 


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const weekSelect =
  document.getElementById("resultWeek");

const resultsTable =
  document.getElementById("resultsTable");


async function loadResults() {

  resultsTable.innerHTML = `
    <tr>
      <td colspan="4">
        Loading results...
      </td>
    </tr>
  `;


  const { data, error } =
    await supabaseClient
      .from("results")
      .select("*")
      .order("week", { ascending: true })
      .order("id", { ascending: true });


  if (error) {

    console.error(error);

    resultsTable.innerHTML = `
      <tr>
        <td colspan="4">
          ❌ Unable to load results.
        </td>
      </tr>
    `;

    return;

  }


  weekSelect.innerHTML =
    `<option value="all">All Weeks</option>`;


  for (let week = 1; week <= 22; week++) {

    weekSelect.innerHTML += `
      <option value="${week}">
        Week ${week}
      </option>
    `;

  }


  displayResults(data || []);

}


function displayResults(results) {

  const selectedWeek =
    weekSelect.value;


  let filteredResults =
    results;


  if (selectedWeek !== "all") {

    filteredResults =
      results.filter(
        result =>
          Number(result.week) ===
          Number(selectedWeek)
      );

  }


  if (filteredResults.length === 0) {

    resultsTable.innerHTML = `
      <tr>
        <td colspan="4">
          No results yet
        </td>
      </tr>
    `;

    return;

  }


  resultsTable.innerHTML = "";


  filteredResults.forEach(result => {

    const fixture =
      result.fixture || "";

    const teams =
      fixture.split(" v ");


    const home =
      teams[0] || "Home";

    const away =
      teams[1] || "Away";


    resultsTable.innerHTML += `

      <tr>

        <td>
          Week ${result.week}
        </td>

        <td>
          ${home}
        </td>

        <td>
          <strong>
            ${result.home_score}
            -
            ${result.away_score}
          </strong>
        </td>

        <td>
          ${away}
        </td>

      </tr>

    `;

  });

}


weekSelect.addEventListener(
  "change",
  () => {

    loadResults();

  }
);


loadResults();

</script>

</body>
</html>
